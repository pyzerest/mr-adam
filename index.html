<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr. Adam — FRC robot CAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b5faa'/%3E%3Cpath d='M7 23V9l9 8 9-8v14' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="#1b5faa"/><path d="M7 23V9l9 8 9-8v14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <input id="docname" spellcheck="false" aria-label="Document name" />
      </div>
      <div id="toolbar"></div>
      <div id="stats"></div>
    </header>
    <aside id="left"></aside>
    <main id="view">
      <canvas id="gizmo"></canvas>
      <div id="viewbtns"></div>
      <div id="labels"></div>
      <div id="props" hidden></div>
      <div id="toasts"></div>
    </main>
    <aside id="right"></aside>
    <footer id="status"><span id="hint"></span><span id="keys">MMB orbit · Shift+MMB pan · wheel zoom · 1/3/7 views · 5 ortho · F frame</span></footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
